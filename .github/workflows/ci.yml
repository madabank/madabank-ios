name: Madabank CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: macos-15
    
    env:
      XC_VERSION: 16.0 # Adjust based on project requirements
      
      # Secrets for potential Match/Fastlane usage
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app # Or appropriate version
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1' # Or from .ruby-version
          bundler-cache: true
          working-directory: Madabank

      - name: Install Tuist
        run: |
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise use -g tuist
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          tuist --version

      - name: Generate Project
        run: |
          cd Madabank
          tuist install
          tuist generate
          
      - name: Run Fastlane CI
        run: |
          cd Madabank
          bundle exec fastlane ci
