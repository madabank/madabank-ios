name: iOS CI

# Manual trigger only - run by clicking "Run workflow" button on GitHub Actions page
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_PAT }}
          
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: Madabank
          
      - name: Install Mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Install Tuist
        run: mise install tuist

      - name: Install dependencies
        working-directory: Madabank
        run: |
          tuist install
          bundle install
        
      - name: Generate project
        working-directory: Madabank
        run: tuist generate
        
      - name: Run Fastlane CI
        working-directory: Madabank
        run: bundle exec fastlane ci

