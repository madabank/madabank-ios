name: Madabank CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: macos-15
    
    env:
      XC_VERSION: 16.0 # Adjust based on project requirements
      
      # Secrets for potential Match/Fastlane usage
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_IDENTIFIER: online.darisadam.madabank
      
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}

      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          xcrun simctl list runtimes
      
      - name: Setup iOS Simulator
        run: |
          # Find and boot an available iPhone simulator
          DEVICE_ID=$(xcrun simctl list devices available iPhone | grep -m 1 "iPhone 15" | grep -o -E "\([0-9A-F-]+\)" | tr -d '()')
          if [ -z "$DEVICE_ID" ]; then
            echo "Creating iPhone 15 Pro simulator..."
            RUNTIME=$(xcrun simctl list runtimes iOS -j | jq -r '.runtimes[-1].identifier')
            xcrun simctl create "iPhone 15 Pro Test" "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro" "$RUNTIME"
            DEVICE_ID=$(xcrun simctl list devices | grep "iPhone 15 Pro Test" | grep -o -E "\([0-9A-F-]+\)" | tr -d '()')
          fi
          echo "SIMULATOR_ID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE_ID" || true # Or appropriate version
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1' # Or from .ruby-version
          bundler-cache: true
          working-directory: Madabank

      - name: Install Tuist
        run: |
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise use -g tuist
          # Add shims to PATH for the current step
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          # Add shims to GITHUB_PATH for subsequent steps
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          tuist version

      - name: Generate Project
        run: |
          cd Madabank
          tuist install
          tuist generate
          
      - name: Run Fastlane CI
        run: |
          cd Madabank
          bundle exec fastlane ci
