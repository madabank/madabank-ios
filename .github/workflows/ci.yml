name: Madabank CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: macos-15
    
    env:
      XC_VERSION: 16.0 # Adjust based on project requirements
      
      # Secrets for potential Match/Fastlane usage
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_IDENTIFIER: online.darisadam.madabank
      
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}

      # ========== CACHING ==========
      
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/swiftlint
            /usr/local/Cellar/xcbeautify
          key: ${{ runner.os }}-homebrew-swiftlint-xcbeautify
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: Madabank/vendor/bundle
          key: ${{ runner.os }}-ruby-3.3-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.3-gems-

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Madabank/.build
            Madabank/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/tuist
            ~/.tuist
            Madabank/.tuist-cache
            Madabank/Tuist/.build
          key: ${{ runner.os }}-tuist-${{ hashFiles('**/Project.swift', '**/Workspace.swift', '**/Dependencies.swift') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      # Cache DerivedData
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/Project.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-${{ hashFiles('**/Project.swift') }}-
            ${{ runner.os }}-deriveddata-

      # ========== SETUP ==========

      - name: Install Homebrew Dependencies
        run: |
          brew install swiftlint xcbeautify || true
      
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
        
      - name: Check and Prepare iOS Simulator
        run: |
          # Use existing or create iPhone 15 Pro
          DEVICE_NAME="iPhone 15 Pro"
          EXISTING_DEVICE=$(xcrun simctl list devices available | grep "$DEVICE_NAME" | head -n 1 | grep -o -E "\([0-9A-F-]+\)" | tr -d '()')
          
          if [ -n "$EXISTING_DEVICE" ]; then
            echo "Using existing device: $EXISTING_DEVICE"
            DEVICE_ID=$EXISTING_DEVICE
          else
            echo "Creating new $DEVICE_NAME simulator"
            RUNTIME=$(xcrun simctl list runtimes iOS -j | jq -r '.runtimes[-1].identifier')
            DEVICE_ID=$(xcrun simctl create "$DEVICE_NAME" "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro" "$RUNTIME")
          fi
          
          # Boot simulator
          echo "Booting simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || echo "Simulator already booted or boot in progress"
          
          # Wait for boot (with timeout)
          echo "Waiting for simulator to be ready..."
          for i in {1..30}; do
            if xcrun simctl list devices | grep "$DEVICE_ID" | grep -q "Booted"; then
              echo "✅ Simulator is ready!"
              break
            fi
            sleep 2
          done
          
          echo "SIMULATOR_DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "SIMULATOR_DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: Madabank

      - name: Install Tuist
        run: |
          if ! command -v tuist &> /dev/null; then
            curl -Ls https://install.tuist.io | bash
          fi
          tuist version

      - name: Generate Project with Tuist
        run: |
          cd Madabank
          tuist install
          tuist generate
          
      - name: Run Fastlane CI
        run: |
          cd Madabank
          bundle exec fastlane ci

      # ========== ARTIFACTS ==========
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: Madabank/fastlane/test_output/
          retention-days: 30
