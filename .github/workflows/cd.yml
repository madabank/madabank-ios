name: Madabank CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy_beta:
    runs-on: macos-15
    
    permissions:
      contents: write

    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }} # For Match git access
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PAT: ${{ secrets.CI_PAT }}
      GIT_AUTHORIZATION: ${{ secrets.GIT_AUTHORIZATION }}
      APP_IDENTIFIER: online.darisadam.madabank
      TEAM_ID: Q99UJS4WY6
      
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      # ========== CACHING ==========
      
      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: Madabank/vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Madabank/.build
            Madabank/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/tuist
            ~/.tuist
            Madabank/.tuist-cache
            Madabank/Tuist/.build
          key: ${{ runner.os }}-tuist-${{ hashFiles('**/Project.swift', '**/Workspace.swift', '**/Dependencies.swift') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Cache Match Certificates
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/MobileDevice/Provisioning Profiles
          key: ${{ runner.os }}-match-${{ secrets.MATCH_PASSWORD }}-${{ hashFiles('**/Matchfile') }}
          restore-keys: |
            ${{ runner.os }}-match-

      # ========== SETUP ==========
      
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          
      # NO SIMULATOR SETUP NEEDED FOR RELEASE BUILDS!
          
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.1'
          bundler-cache: true
          working-directory: Madabank

      - name: Install Tuist
        run: |
          if ! command -v tuist &> /dev/null; then
            curl -Ls https://install.tuist.io | bash
          else
            echo "Tuist already installed"
            tuist version
          fi

      - name: Generate Project with Tuist
        run: |
          cd Madabank
          tuist install
          tuist generate
          
      - name: Configure Git for Push
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run Fastlane Beta
        run: |
          cd Madabank
          bundle exec fastlane beta
