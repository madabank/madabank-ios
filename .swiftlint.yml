# SwiftLint Configuration for Madabank iOS
# Documentation: https://realm.github.io/SwiftLint/

# Paths to include
included:
  - Madabank/Madabank/Sources
  - Madabank/Modules

# Paths to exclude
excluded:
  - Madabank/Tuist
  - Madabank/Derived
  - "*/Derived/*"
  - "*/Tests/*"
  - Pods
  - .build
  - .tuist-bin
  - Madabank/vendor  # Exclude vendor directory to avoid linting third-party code

# Enabled rules
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Disabled rules
disabled_rules:
  - todo
  - trailing_whitespace
  - line_length
  - cyclomatic_complexity
  - function_body_length
  - type_body_length
  - file_length

# Rule configurations
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - vc
    - vm
    - rx
    - x
    - y

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

function_parameter_count:
  warning: 6
  error: 8

nesting:
  type_level:
    warning: 3

large_tuple:
  warning: 3
  error: 4

force_cast: warning
force_try: warning
force_unwrapping: warning


# Custom rules
custom_rules:
  no_print:
    name: "No print statements"
    regex: "\\bprint\\s*\\("
    message: "Use proper logging instead of print()"
    severity: warning
    
  no_nslog:
    name: "No NSLog statements"
    regex: "\\bNSLog\\s*\\("
    message: "Use proper logging instead of NSLog()"
    severity: warning
